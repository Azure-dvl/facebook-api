<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      background: #f0f2f5;
      color: #1c1e21;
    }
    .header {
      background: #1877f2;
      color: #fff;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: bold;
    }
    .body { padding: 16px; }
    label { font-size: 12px; color: #65676b; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #dddfe2;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #1877f2; }
    button {
      width: 100%;
      padding: 10px;
      background: #1877f2;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #166fe5; }
    button:disabled { background: #9cb9e8; cursor: default; }
    .hint { font-size: 11px; color: #65676b; margin-top: 12px; line-height: 1.4; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.4;
      padding: 10px;
      border-radius: 6px;
      display: none;
      word-break: break-word;
    }
    .status.ok { background: #e6f4ea; color: #137333; display: block; }
    .status.err { background: #fce8e6; color: #c5221f; display: block; }
    .status.info { background: #e8f0fe; color: #1a73e8; display: block; }
  </style>
</head>
<body>
  <div class="header">Facebook API</div>
  <div class="body">
    <label for="apiUrl">URL de la API</label>
    <input id="apiUrl" type="text" placeholder="http://localhost:8000" />

    <button id="exportBtn">Exportar sesion de Facebook</button>

    <div id="status" class="status"></div>

    <div class="hint">
      1. Abre facebook.com y logueate.<br />
      2. Vuelve aqui y pulsa "Exportar sesion".<br />
      3. Si todo va bien, la API recibira tus cookies y podras publicar.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
