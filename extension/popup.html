<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook API</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icons/icon48.png" alt="" class="logo" />
      <div class="header-titles">
        <h1 class="title">Facebook <span class="cat-paw">API</span></h1>
        <p class="subtitle">Exportador de sesión</p>
      </div>
    </header>

    <div class="field">
      <label class="label" for="apiUrl">URL de la API</label>
      <input id="apiUrl" type="text" placeholder="http://localhost:8000" spellcheck="false" />
    </div>

    <button id="exportBtn" class="btn" type="button">Exportar sesión de Facebook</button>

    <div id="status" class="status" role="status"></div>

    <ol class="hint">
      <li>Abre facebook.com y loguéate en esta misma ventana.</li>
      <li>Vuelve aquí y pulsa "Exportar sesión".</li>
      <li>Si todo va bien, la API recibe tus cookies y podrás publicar.</li>
    </ol>
  </div>
  <script src="popup.js"></script>
</body>
</html>
